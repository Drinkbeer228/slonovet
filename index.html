  <body>
    <div id="root"></div>
    <script>
      // диагностика запуска до загрузки приложения: ошибки и «страница открылась» — отметкой в журнале сервера (/diag)
      (function () {
        var n = 0;
        function d(e, m) {
          if (n++ > 10) return;
          try {
            var s = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches) ? 1 : 0;
            navigator.sendBeacon && navigator.sendBeacon('/diag?e=' + e + '&s=' + s + '&d=' + encodeURIComponent(String(m || '').slice(0, 300)));
          } catch (x) {}
        }
        addEventListener('error', function (e) { d('early-error', e.message + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno); });
        addEventListener('unhandledrejection', function (e) { d('early-rejection', (e.reason && e.reason.message) || e.reason); });
        d('html');
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
