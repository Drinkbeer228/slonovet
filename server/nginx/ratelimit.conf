# /etc/nginx/conf.d/slonovet-ratelimit.conf — зона для ограничения попыток входа (см. slonovet.conf)
# Считаем только вход по паролю (grant_type=password). Обновление входа (refresh_token) идёт на тот же адрес,
# но его не ограничиваем: на 429 supabase-js не повторяет запрос, а выкидывает человека из приложения —
# а за одним адресом (Wi-Fi, мобильный оператор) сидит вся труппа, и после дороги телефоны обновляются разом.
# Пустой ключ nginx не считает.
map $arg_grant_type $slonovet_login_key {
    password $binary_remote_addr;
    default "";
}
limit_req_zone $slonovet_login_key zone=slonovet_password:10m rate=10r/m;
