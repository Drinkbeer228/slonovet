# nginx на сервере: /etc/nginx/sites-available/slonovet (копия; certbot дописывает свои строки сам)
# Сайт: собранные файлы приложения
server {
    server_name slonovet.ru www.slonovet.ru;
    root /var/www/slonovet;
    index index.html;

    # обновления приложения должны приходить сразу
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ /index.html; }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/slonovet.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/slonovet.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# API: свой Supabase. Наружу только то, что нужно приложению; панель Studio — через SSH-туннель
server {
    server_name api.slonovet.ru;
    client_max_body_size 25m;

    location ~ ^/(auth|rest|storage|functions|realtime)/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
    # вход по паролю и обновление входа: не больше 10 запросов в минуту с одного адреса (плюс запас 10),
    # дальше — 429. Подбор пароля так растягивается на годы; обычной работе (обновление раз в час) не мешает
    location = /auth/v1/token {
        limit_req zone=slonovet_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { return 404; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.slonovet.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.slonovet.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.slonovet.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = slonovet.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name slonovet.ru www.slonovet.ru;
    return 404; # managed by Certbot




}
server {
    if ($host = api.slonovet.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name api.slonovet.ru;
    return 404; # managed by Certbot


}