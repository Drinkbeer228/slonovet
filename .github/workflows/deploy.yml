# Выкладка: каждый push в main проверяет и собирает приложение и кладёт его на сервер Beget.
# Адрес: https://slonovet.ru (nginx на сервере, папка /var/www/slonovet, пользователь deploy).
name: Выкладка

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Отправить на сервер
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # ключ сервера записан здесь, чтобы не подключиться к подменённому
          echo "159.194.208.29 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGYsLfZgNv9gecQxSwvJjbbUYqMitmvS1ncpKJHqr3sE" > ~/.ssh/known_hosts
          rsync -rlz --delete-after -e "ssh -i ~/.ssh/deploy" dist/ deploy@159.194.208.29:/var/www/slonovet/
