# Проверка доступности публичной версии на GitHub Pages
name: Доступность

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Проверка GitHub Pages
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 2 --retry-delay 10 --max-time 20 "https://drinkbeer228.github.io/slonovet/")
          echo "$code  https://drinkbeer228.github.io/slonovet/"
          [ "$code" = 200 ] || exit 1
