# Резервная копия базы данных внешнего сервера (опционально, только при настроенных секретах).
name: Резервная копия

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    if: ${{ secrets.BACKUP_SSH_KEY != '' && secrets.BACKUP_HOST != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Забрать копию с сервера
        env:
          BACKUP_SSH_KEY: ${{ secrets.BACKUP_SSH_KEY }}
          BACKUP_HOST: ${{ secrets.BACKUP_HOST }}
          BACKUP_KNOWN_HOST: ${{ secrets.BACKUP_KNOWN_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$BACKUP_SSH_KEY" > ~/.ssh/backup && chmod 600 ~/.ssh/backup
          printf '%s\n' "$BACKUP_KNOWN_HOST" > ~/.ssh/known_hosts
          mkdir backup
          rsync -t -e "ssh -i ~/.ssh/backup" "slonovet-backup@${BACKUP_HOST}:db-latest.dump" backup/
          test -s backup/db-latest.dump
      - name: Зашифровать
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          tar czf - backup | gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o slonovet-backup.tar.gz.gpg
          rm -rf backup
      - uses: actions/upload-artifact@v4
        with:
          name: slonovet-backup-${{ github.run_number }}
          path: slonovet-backup.tar.gz.gpg
          retention-days: 90
