# Копия базы вне сервера раз в неделю — сама, без участия людей.
# Сервер каждую ночь делает свою копию (server/backup.sh: база — 14 дней, фото — зеркало). Отсюда раз в неделю
# свежая копия базы забирается, шифруется паролем (BACKUP_PASSPHRASE) и хранится 90 дней в Actions → «Резервная копия»,
# чтобы люди и записи пережили даже потерю сервера. Фото сюда не идут — места на GitHub мало, они в зеркале на сервере.
# Расшифровать: gpg -d slonovet-backup.tar.gz.gpg | tar xz
# Восстановить базу: pg_restore --clean --if-exists -U postgres -d postgres db-latest.dump (в контейнере supabase-db)
name: Резервная копия

on:
  schedule:
    - cron: '0 3 * * 1' # понедельник, 06:00 по Москве
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать копию с сервера
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "159.194.208.29 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGYsLfZgNv9gecQxSwvJjbbUYqMitmvS1ncpKJHqr3sE" > ~/.ssh/known_hosts
          mkdir backup
          rsync -L -e "ssh -i ~/.ssh/deploy" deploy@159.194.208.29:/opt/slonovet/backups/db-latest.dump backup/
          ls -l backup
          test -s backup/db-latest.dump
      - name: Зашифровать
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          tar czf - backup | gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o slonovet-backup.tar.gz.gpg
          rm -rf backup
      - uses: actions/upload-artifact@v4
        with:
          name: slonovet-backup-${{ github.run_number }}
          path: slonovet-backup.tar.gz.gpg
          retention-days: 90
