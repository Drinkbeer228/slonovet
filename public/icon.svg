<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  <!-- Veterinary Heart & Cross Accent -->
  <circle cx="410" cy="110" r="48" fill="#22c55e" opacity="0.4" />
  <path d="M410 85 V135 M385 110 H435" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <!-- Stylized Elephant Head / Body in White -->
  <g fill="#ffffff" filter="url(#shadow)" transform="translate(40, 50) scale(0.85)">
    <!-- Elephant silhouette -->
    <path d="M 230,120 C 180,120 130,140 100,180 C 70,220 70,270 70,330 C 70,390 100,430 160,430 C 180,430 190,400 190,370 C 190,340 170,320 150,320 C 130,320 120,330 115,340 C 110,310 115,260 140,220 C 160,190 200,180 230,180 C 270,180 320,195 350,225 C 380,255 390,290 390,350 L 410,350 C 435,350 450,335 450,310 C 450,285 435,270 420,270 L 420,230 C 420,170 340,120 230,120 Z" />
    <!-- Trunk curve -->
    <path d="M 120,270 C 90,300 70,360 80,420 C 85,450 120,470 150,450 C 170,435 170,400 150,390 C 130,380 120,400 110,390 C 105,370 110,330 130,300 Z" opacity="0.95" />
    <!-- Tusk -->
    <path d="M 180,310 C 180,340 170,380 140,400 C 135,395 150,370 155,340 C 160,320 170,305 180,310 Z" fill="#fef08a" />
    <!-- Gentle Eye -->
    <circle cx="210" cy="225" r="9" fill="#15803d" />
    <!-- Ear curve -->
    <path d="M 280,180 C 330,190 365,240 360,310 C 355,360 320,410 270,410 C 255,410 260,390 275,380 C 305,360 320,330 320,280 C 320,230 290,200 270,190 Z" fill="#e2e8f0" opacity="0.8" />
  </g>
</svg>
